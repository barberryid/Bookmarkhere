# Cloudflare Workers config (the Astro 6 adapter no longer supports Pages).
# Deploy: npm run deploy   Schema changes: npm run db:migrate:remote
name = "linkshelf"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-06-10"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "linkshelf"
database_id = "8901c075-180f-4e7a-ade8-4fdefe124377"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSION"
id = "e2c9de6f4433470ea71333a695141a12"
