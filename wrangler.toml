# Cloudflare Workers config (the Astro 6 adapter no longer supports Pages).
# Before the first remote deploy:
#   1. npx wrangler d1 create linkshelf  -> paste database_id below
#   2. npx wrangler kv namespace create SESSION -> paste id below
#   3. npm run db:migrate:remote
#   4. npm run deploy
name = "linkshelf"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-06-10"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "linkshelf"
database_id = "replace-with-cloudflare-d1-database-id"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSION"
id = "replace-with-cloudflare-kv-namespace-id"
